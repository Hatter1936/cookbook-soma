<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепты бойца Сомы</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-top">
                <nav class="nav-main">
                    <ul>
                        <img src="https://img.freepik.com/premium-photo/powerful-explosion-with-fire-transparent-background_888418-26837.jpg" class="logo"></img>
                        <li><a href="index.html">Мои рецепты</a></li>
                        <li><a href="achievements.html">Мои достижения</a></li>
                        <li><a href="">Мне повезёт</a></li>
                    
                    </ul>
                </nav>
                <div class="header-icons">
                    <a href="login.html" class="slowhover">Вход</a>
                    <a href="register.html" class="btn">Регистрация</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="addrecipe">
            <div class="addrecipe-section">
                <div class="addrecipe-element">
                    <label">Фото</label>
                    <input type="button" class="addrecipe-button" id="photo" value="Выбрать файл...">
                </div>
            </div>
            <div class="addrecipe-section">
                <div class="addrecipe-element">
                    <label">Название</label>
                    <input type="text" class="addrecipe-field" id="title">
                </div>
            </div>
            <div class="addrecipe-section">
                <div class="addrecipe-element">
                    <label">Описание</label>
                    <textarea id="description" class="addrecipe-field" rows="4" cols="50"></textarea>
                </div>
            </div>
            <div class="addrecipe-section">
                <div class="addrecipe-element">
                    <label>Категория</label>
                    <div>
                        <input type="button" class="addrecipe-button" id="category" value="Выбрать...">
                    </div>
                </div>
                <div class="addrecipe-element">
                    <label>Стоимость</label>
                    <div class="addrecipe-element-shortfield">
                        <input type="textarea" class="addrecipe-field" id="cost">
                        <p>руб.</p>
                    </div>
                </div>
                <div class="addrecipe-element">
                    <label>Время приготовления</label>
                    <div class="addrecipe-element-shortfield">
                        <input type="textarea" class="addrecipe-field" id="time">
                        <p>мин.</p>
                    </div>
                </div>
            </div>
            <div class="addrecipe-section">
                <div class="addrecipe-element">
                    <label>Ингредиенты</label>
                    <div class="addrecipe-element-rowelements">
                        <input type="text" class="addrecipe-field" id="ingredients">
                        <input type="text" class="addrecipe-field" id="amount">
                        <input type="button" class="addrecipe-button" id="spoons" value="шт.">
                    </div>
                    <i type="button" class="fa-solid fa-plus" id="addingredient" style="margin-bottom: 30px;"></i>
                </div>
            </div>
            <div class="addrecipe-stepssection">
                <label>Приготовление</label>
                <div class="addrecipe-step">
                    <label>Шаг</label>
                    <br><input type="button" class="addrecipe-button" id="stepimage" value="Выбрать файл...">
                    <textarea id="stepdescription" class="addrecipe-field" rows="4" cols="50"></textarea>
                    <i type="button" class="fa-solid fa-plus" id="addstep" style="margin-bottom: 30px;"></i>
                </div>
            </div>
            <input type="button" class="addrecipe-button" id="addrecipesave" value="Добавить рецепт">
        </div>
    </div>

</body>
</html>
