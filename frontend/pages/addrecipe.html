<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепты бойца Сомы</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-top">
                <nav class="nav-main">
                    <ul>
                        <img src="https://img.freepik.com/premium-photo/powerful-explosion-with-fire-transparent-background_888418-26837.jpg" class="logo" alt="Логотип">
                        <li><a href="index.html">Мои рецепты</a></li>
                        <li><a href="achievements.html">Мои достижения</a></li>
                        <li><a href="#">Мне повезёт</a></li>
                    </ul>
                </nav>
                <div class="header-icons">
                    <a href="login.html" class="slowhover">Вход</a>
                    <a href="register.html" class="btn">Регистрация</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <form class="addrecipe" id="recipeForm">
        <div class="addrecipe-section">
            <div class="addrecipe-element">
                <label for="photo">Фото</label>
                <div class="file-input-wrapper">
                    <input type="file" id="photo" accept="image/*">
                    <div class="file-input-button">Выбрать файл...</div>
                </div>
            </div>
        </div>

            <div class="addrecipe-section">
                <div class="addrecipe-element">
                    <label for="title">Название</label>
                    <input type="text" class="addrecipe-field" id="title" required>
                </div>
            </div>

            <div class="addrecipe-section">
                <div class="addrecipe-element">
                    <label for="description">Описание</label>
                    <textarea id="description" class="addrecipe-field" rows="4" required></textarea>
                </div>
            </div>

            <div class="addrecipe-section">
                <div class="addrecipe-element">
                    <label for="category">Категория</label>
                    <select id="category" class="addrecipe-button" required>
                        <option value="">Загрузка категорий...</option>
                    </select>
                </div>

                <div class="addrecipe-element">
                    <label for="cost">Стоимость</label>
                    <div class="addrecipe-element-shortfield">
                        <input type="text" class="addrecipe-field" id="cost" pattern="\d*" inputmode="numeric" placeholder="0" required>
                        <span>руб.</span>
                    </div>
                </div>

                <div class="addrecipe-element">
                    <label for="time">Время приготовления</label>
                    <div class="addrecipe-element-shortfield">
                        <input type="text" class="addrecipe-field" id="time" pattern="\d*" inputmode="numeric" placeholder="0" required>
                        <span>мин.</span>
                    </div>
                </div>
            </div>

            <div class="addrecipe-section">
                <div class="addrecipe-element">
                    <label>Ингредиенты</label>
                    <div id="ingredients-container">
                        <div class="addrecipe-element-rowelements ingredient-row">
                            <input type="text" class="addrecipe-field ingredient-name" placeholder="Название" required>
                            <input type="text" class="addrecipe-field ingredient-amount" placeholder="Количество" required>
                            <select class="addrecipe-button ingredient-unit" required>
                                <option value="шт.">шт.</option>
                                <option value="г">г</option>
                                <option value="кг">кг</option>
                                <option value="мл">мл</option>
                                <option value="л">л</option>
                                <option value="ст.л.">ст.л.</option>
                                <option value="ч.л.">ч.л.</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="add-icon" id="addingredient" aria-label="Добавить ингредиент">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <div class="addrecipe-stepssection">
                <label>Приготовление</label>
                <div id="steps-container">
                    <div class="addrecipe-step step-row">
                        <label for="stepimage-1">Шаг 1</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="stepimage-1" accept="image/*">
                            <div class="file-input-button">Выбрать файл...</div>
                        </div>
                        <textarea class="addrecipe-field step-description" placeholder="Описание шага" rows="4" required></textarea>
                    </div>
                </div>
                <button type="button" class="add-icon" id="addstep" aria-label="Добавить шаг">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <button type="submit" class="addrecipe-button" id="addrecipesave">Добавить рецепт</button>
        </form>
    </main>

<script src="../js/addrecipe.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
