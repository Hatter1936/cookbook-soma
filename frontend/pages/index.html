<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепты бойца Сомы</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head> 
<body>
    <header>
        <div class="container">
            <div class="header-top">
                <nav class="nav-main">
                    <ul>
                        <img src="../assets/images/logo.png" class="logo"></img>
                        <li><a href="index.html">Мои рецепты</a></li>
                        <li><a href="achievements.html">Мои достижения</a></li>
                        <li><a href="#" id="lucky-btn">Мне повезёт</a></li>
                    
                    </ul>
                </nav>
                <div class="header-icons">
                    <a href="login.html" class="slowhover">Вход</a>
                    <a href="register.html" class="btn">Регистрация</a>
                </div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="container-buttons">
            <button id="filter-button" class="btn">Фильтры</button>
            <a href="addrecipe.html"><input type="submit" id="addrecipe" class="btn" value="Добавить рецепт"></a>
        </div>

        <div id="filterDropdown" class="filter-dropdown">
            <div class="filter-dropdown-content">
                <div class="filter-row">
                    <label for="filterCategory">Категория:</label>
                    <div style="display: flex; gap: 10px; width: 60%;">
                        <select id="filterCategory" class="filter-select" style="flex: 1;">
                            <option value="">Все категории</option>
                        </select>
                        <button id="addCategoryBtn" class="btn" style="padding: 8px 15px; font-size: 16px; white-space: nowrap;">+</button>
                    </div>
                </div>   
                <div class="filter-row">
                    <label for="sortTime">Время приготовления:</label>
                    <select id="sortTime" class="filter-select">
                        <option value="">Без сортировки</option>
                        <option value="asc">Сначала быстрые</option>
                        <option value="desc">Сначала долгие</option>
                    </select>
                </div>   
                <div class="filter-row">
                    <label for="sortAlpha">По алфавиту:</label>
                    <select id="sortAlpha" class="filter-select">
                        <option value="">Без сортировки</option>
                        <option value="asc">А-Я</option>
                        <option value="desc">Я-А</option>
                    </select>
                </div>   
                <div class="filter-row checkbox-row">
                    <label>
                        <input type="checkbox" id="favoritesOnly">
                        Только избранное
                    </label>
                </div> 
                <div class="filter-buttons">
                    <button id="applyFilters" class="btn">Применить фильтры</button>
                    <button id="resetFilters" class="btn">Сбросить</button>
                </div>
            </div>
        </div>
                
        <div class="recipes">
        </div>
    </div>
    
<script src="../js/auth.js"></script>
<script src="../js/index.js"></script>
<script src="../js/filter.js"></script>
<script src="../js/categories.js"></script>

</body>
</html>
