<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепты бойца Сомы</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head> 
<body>
    <header>
        <div class="container">
            <div class="header-top">
                <nav class="nav-main">
                    <ul>
                        <img src="https://img.freepik.com/premium-photo/powerful-explosion-with-fire-transparent-background_888418-26837.jpg" class="logo"></img>
                        <li><a href="index.html">Мои рецепты</a></li>
                        <li><a href="achievements.html">Мои достижения</a></li>
                        <li><a href="">Мне повезёт</a></li>
                    
                    </ul>
                </nav>
                <div class="header-icons">
                    <a href="login.html" class="slowhover">Вход</a>
                    <a href="register.html" class="btn">Регистрация</a>
                </div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="container-buttons">
            <a href="addrecipe.html"><input type="submit" id="filter-button" class="btn" value="Фильтры и сортировка"></a>
            <a href="addrecipe.html"><input type="submit" id="addrecipe" class="btn" value="Добавить рецепт"></a>
        </div>
        <div class="filter-row">
            <label for="filterCategory">Категория:</label>
            <select id="filterCategory" class="filter-select">
                <option value="">Все категории</option>
                <option value="1">Закуска</option>
                <option value="2">Горячее</option>
                <option value="3">Холодное</option>
                <option value="4">Салат</option>
                <option value="5">Десерт</option>
            </select>
        </div>    
        <div class="filter-row">
            <label for="sortTime">Время приготовления:</label>
            <select id="sortTime" class="filter-select">
                <option value="">Без сортировки</option>
                <option value="asc">Меньше по времени</option>
                <option value="desc">Больше по времени</option>
            </select>
        </div>   
        <div class="filter-row">
            <label for="sortAlpha">По алфавиту:</label>
            <select id="sortAlpha" class="filter-select">
                <option value="">Без сортировки</option>
                <option value="asc">А-Я</option>
                <option value="desc">Я-А</option>
            </select>
        </div>   
        <div class="filter-row checkbox-row">
            <label>
                <input type="checkbox" id="favoritesOnly">
                Только избранное
            </label>
        </div> 
        <div class="filter-buttons">
            <button id="applyFilters" class="btn">Применить фильтры</button>
            <button id="resetFilters" class="btn">Сбросить</button>
        </div>
                
        <div class="recipes">
        </div>
    </div>
    
<script src="../js/auth.js"></script>
<script src="../js/index.js"></script>

</body>
</html>
